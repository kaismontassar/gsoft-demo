name: gsoft-demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  JF_URL: https://jfrogkmm.jfrog.io
  JF_PROJECT: gsoft
  JFROG_CLI_BUILD_NAME: gsoft-demo
  JFROG_CLI_BUILD_NUMBER: "${{ github.run_number }}.${{ github.run_attempt }}"

jobs:
  ci:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Set up JFrog CLI with OIDC
        id: jfrog_setup
        uses: jfrog/setup-jfrog-cli@v4
        with:
          oidc-provider-name: globalsoft-github
          oidc-audience: globalsoft-github-actions
          disable-auto-build-publish: true

      - name: Check Artifactory connection
        run: jf rt ping

      - name: Check DEV repository read access
        shell: bash
        run: |
          jf rt curl -f -sS "/api/storage/gsoft-npm-dev-local" \
            | jq -e '.repo == "gsoft-npm-dev-local"'

      - name: Configure npm repositories
        run: |
          jf npm-config \
            --server-id-resolve=setup-jfrog-cli-server \
            --repo-resolve=gsoft-npm-dev-virtual \
            --server-id-deploy=setup-jfrog-cli-server \
            --repo-deploy=gsoft-npm-dev-local

      - name: Prepare CI package
        run: |
          npm pkg set publishConfig.registry="https://jfrogkmm.jfrog.io/artifactory/api/npm/gsoft-npm-dev-local/"
          npm pkg delete private
          npm version "1.0.0-ci.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" --no-git-tag-version --ignore-scripts

      - name: Initialize npm cache
        run: mkdir -p "$(npm config get cache)/_cacache"

      - name: Install dependencies and collect build information
        run: |
          jf npm ci \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --build-name="$JFROG_CLI_BUILD_NAME" \
            --build-number="$JFROG_CLI_BUILD_NUMBER" \
            --module=gsoft-demo

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Package and publish to DEV
        run: |
          jf npm publish \
            --ignore-scripts \
            --build-name="$JFROG_CLI_BUILD_NAME" \
            --build-number="$JFROG_CLI_BUILD_NUMBER" \
            --project="$JF_PROJECT" \
            --module=gsoft-demo

      - name: Publish build information
        run: |
          jf rt build-publish \
            "$JFROG_CLI_BUILD_NAME" "$JFROG_CLI_BUILD_NUMBER" \
            --project="$JF_PROJECT" \
            --collect-git-info \
            --build-url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Inspect CI authorization
        env:
          DIAGNOSTIC_JF_TOKEN: ${{ steps.jfrog_setup.outputs.oidc-token }}
        run: |
          python3 - <<'PYTOKEN'
          import base64
          import json
          import os
          import time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from urllib.parse import quote, urlencode

          token = os.environ.get("DIAGNOSTIC_JF_TOKEN", "")
          if not token:
              raise SystemExit("Token output unavailable; no credentials printed.")

          parts = token.split(".")
          if len(parts) == 3:
              try:
                  payload = parts[1] + "=" * (-len(parts[1]) % 4)
                  claims = json.loads(base64.urlsafe_b64decode(payload))
              except Exception:
                  raise SystemExit("Could not decode token metadata.")
              for key in ("scp", "aud"):
                  print(f"{key}: {json.dumps(claims.get(key))}")
              if isinstance(claims.get("exp"), (int, float)):
                  print("Token seconds remaining:", int(claims["exp"] - time.time()))
          else:
              print("Opaque token: role metadata cannot be decoded locally.")

          base = os.environ["JF_URL"].rstrip("/")
          name = quote(os.environ["JFROG_CLI_BUILD_NAME"], safe="")
          number = quote(os.environ["JFROG_CLI_BUILD_NUMBER"], safe="")
          query = urlencode({"project": os.environ["JF_PROJECT"]})
          checks = [
              ("Xray version", "/xray/api/v1/system/version"),
              ("Published build read", f"/artifactory/api/build/{name}/{number}?{query}")
          ]
          for label, endpoint in checks:
              request = Request(
                  base + endpoint,
                  headers={"Authorization": "Bearer " + token}
              )
              try:
                  with urlopen(request, timeout=20) as response:
                      print(f"{label}: HTTP {response.status}")
                      if label == "Xray version":
                          data = json.load(response)
                          print("Xray version:", data.get("xray_version", data.get("version", "not supplied")))
              except HTTPError as error:
                  print(f"{label}: HTTP {error.code}")
              except Exception:
                  print(f"{label}: connection failed")

          scan_url = base + "/xray/api/v2/ci/build?" + urlencode({
              "projectKey": os.environ["JF_PROJECT"]
          })
          payload = json.dumps({
              "build_name": os.environ["JFROG_CLI_BUILD_NAME"],
              "build_number": os.environ["JFROG_CLI_BUILD_NUMBER"],
              "project": os.environ["JF_PROJECT"],
              "rescan": False
          }).encode()
          request = Request(
              scan_url,
              data=payload,
              method="POST",
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json"
              }
          )
          try:
              with urlopen(request, timeout=30) as response:
                  print("Direct scan API: HTTP", response.status)
                  body = response.read(8192).decode(errors="replace")
                  print("Scan API response:", json.dumps(body.replace(token, "[REDACTED]")))
          except HTTPError as error:
              print("Direct scan API: HTTP", error.code)
              body = error.read(8192).decode(errors="replace")
              print("Scan API response:", json.dumps(body.replace(token, "[REDACTED]")))
          except Exception:
              print("Direct scan API: connection failed or timed out.")
          PYTOKEN

      - name: Xray policy gate
        timeout-minutes: 8
        env:
          JFROG_CLI_LOG_LEVEL: DEBUG
        run: |
          jf --version
          jf build-scan \
            "$JFROG_CLI_BUILD_NAME" "$JFROG_CLI_BUILD_NUMBER" \
            --project="$JF_PROJECT" \
            --fail=true \
            --extended-table=true
