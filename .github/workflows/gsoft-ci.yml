name: gsoft-demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: kaismontassar/gsoft-demo/.github/workflows/jfrog-npm-ci.yml@12ba32aa76883c493409c8f2679d09f104cabfa4
    with:
      project-key: gsoft
      npm-resolve-repo: gsoft-npm-dev-virtual
      npm-dev-repo: gsoft-npm-dev-local
      npm-staging-repo: gsoft-npm-staging-local
      build-name: gsoft-demo
